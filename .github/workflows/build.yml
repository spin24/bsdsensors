name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  freebsd:
    name: Build on FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y cmake protobuf gflags glog googletest
          run: |
            set -e
            cmake -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build
            cmake --install build --prefix stage
            tar czf bsdsensors-freebsd.tar.gz -C stage .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bsdsensors-freebsd
          path: bsdsensors-freebsd.tar.gz
